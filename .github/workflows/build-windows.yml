name: Build BONKO Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: BONKO semantic version
        required: true
        default: 2.1.1
      allow_unsigned_qa:
        description: Build a private unsigned QA artifact (never publish)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      BONKO_VERSION: ${{ inputs.version }}
      BONKO_SOURCE_URL: ${{ secrets.BONKO_WINDOWS_SOURCE_URL }}
      BONKO_SOURCE_PASSWORD: ${{ secrets.BONKO_WINDOWS_SOURCE_PASSWORD }}
      BONKO_WINDOWS_CERT_PASSWORD: ${{ secrets.BONKO_WINDOWS_CERT_PASSWORD }}
      BONKO_ALLOW_UNSIGNED_QA: ${{ inputs.allow_unsigned_qa }}

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Download protected desktop source
        shell: pwsh
        run: |
          if (-not $env:BONKO_SOURCE_URL -or -not $env:BONKO_SOURCE_PASSWORD) {
            throw "Protected source download is not configured"
          }
          Invoke-WebRequest -Uri $env:BONKO_SOURCE_URL -OutFile source.tar.gz.enc
          & openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 `
            -in source.tar.gz.enc -out source.tar.gz -pass env:BONKO_SOURCE_PASSWORD
          if ($LASTEXITCODE -ne 0) { throw "Source archive decryption failed" }
          New-Item -ItemType Directory -Force -Path source | Out-Null
          tar -xzf source.tar.gz -C source
          Remove-Item -Force source.tar.gz.enc, source.tar.gz

      - name: Enable the native MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare trusted Authenticode identity
        if: ${{ !inputs.allow_unsigned_qa }}
        shell: pwsh
        env:
          BONKO_WINDOWS_CERT_PFX_BASE64: ${{ secrets.BONKO_WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if (-not $env:BONKO_WINDOWS_CERT_PFX_BASE64 -or -not $env:BONKO_WINDOWS_CERT_PASSWORD) {
            throw "Trusted Authenticode signing is not configured"
          }
          $pfx = Join-Path $env:RUNNER_TEMP "bonko-authenticode.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:BONKO_WINDOWS_CERT_PFX_BASE64))
          "BONKO_WINDOWS_CERT_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure BONKO for Windows x64
        shell: pwsh
        run: |
          $project = "source/audio-plugin-coder/plugins/BonkerStream"
          $build = "$project/release/build-$env:BONKO_VERSION-windows-msvc"
          cmake -S $project -B $build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DBONKO_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Build plug-in and processor tests
        shell: pwsh
        run: |
          $build = "source/audio-plugin-coder/plugins/BonkerStream/release/build-$env:BONKO_VERSION-windows-msvc"
          cmake --build $build --target BonkerStreamTests BonkerStream_VST3 --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }

      - name: Run Windows processor and local-server tests
        shell: pwsh
        run: |
          $test = "source/audio-plugin-coder/plugins/BonkerStream/release/build-$env:BONKO_VERSION-windows-msvc/BonkerStreamTests_artefacts/Release/BonkerStreamTests.exe"
          & $test
          if ($LASTEXITCODE -ne 0) { throw "BONKO Windows processor tests failed" }

      - name: Validate Windows VST3 with pluginval
        shell: pwsh
        run: |
          $plugin = "source/audio-plugin-coder/plugins/BonkerStream/release/build-$env:BONKO_VERSION-windows-msvc/BonkerStream_artefacts/Release/VST3/Bonko Streamer.vst3"
          Invoke-WebRequest `
            -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" `
            -OutFile pluginval.zip
          Expand-Archive -LiteralPath pluginval.zip -DestinationPath pluginval
          $validator = Get-ChildItem pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1
          if (-not $validator) { throw "pluginval.exe not found" }
          New-Item -ItemType Directory -Force -Path pluginval-results | Out-Null
          # Level 5 is Tracktion's documented host-compatibility baseline.
          # The processor test above separately executes 10,000 MONO parameter
          # automation and render cycles before this full VST3/editor pass.
          $processInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $processInfo.FileName = $validator.FullName
          $processInfo.UseShellExecute = $false
          $processInfo.ArgumentList.Add("--strictness-level")
          $processInfo.ArgumentList.Add("5")
          $processInfo.ArgumentList.Add("--output-dir")
          $processInfo.ArgumentList.Add("pluginval-results")
          $processInfo.ArgumentList.Add($plugin)
          $validatorProcess = [System.Diagnostics.Process]::Start($processInfo)
          $validatorProcess.WaitForExit()
          $validatorExitCode = $validatorProcess.ExitCode

          # pluginval 1.0.4 on current Windows runners can return process code 1
          # after its own report has completed with SUCCESS. Gate on the
          # persisted validator report so a real failed or truncated pass still
          # fails the release.
          $resultFiles = @(Get-ChildItem pluginval-results -Recurse -File -Filter *.txt)
          if ($resultFiles.Count -ne 1) {
            throw "Expected exactly one pluginval result file, found $($resultFiles.Count)"
          }

          $resultText = Get-Content -LiteralPath $resultFiles[0].FullName -Raw
          $requiredEvidence = @(
            "Completed tests in pluginval / Audio processing",
            "Completed tests in pluginval / Plugin state",
            "Completed tests in pluginval / Automation",
            "Completed tests in pluginval / Editor Automation",
            "Completed tests in pluginval / Restoring default layout",
            "SUCCESS"
          )
          foreach ($evidence in $requiredEvidence) {
            if (-not $resultText.Contains($evidence)) {
              throw "pluginval result is incomplete: missing '$evidence'"
            }
          }
          if ($resultText.Contains("FAILURE")) {
            throw "pluginval result contains FAILURE"
          }
          if ($validatorExitCode -ne 0) {
            Write-Warning "pluginval returned $validatorExitCode after its persisted report completed with SUCCESS"
          }

      - name: Build Windows installer and complete download package
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }
          $project = "source/audio-plugin-coder/plugins/BonkerStream"
          if ($env:BONKO_ALLOW_UNSIGNED_QA -eq "true") {
            & "$project/installer/build_windows_download.ps1" -Version $env:BONKO_VERSION -SkipSigning
          } else {
            & "$project/installer/build_windows_download.ps1" -Version $env:BONKO_VERSION
          }
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed" }

      - name: Verify trusted release signatures
        if: ${{ !inputs.allow_unsigned_qa }}
        shell: pwsh
        run: |
          $project = "source/audio-plugin-coder/plugins/BonkerStream"
          $release = "$project/release"
          $plugin = "$project/release/build-$env:BONKO_VERSION-windows-msvc/BonkerStream_artefacts/Release/VST3/Bonko Streamer.vst3/Contents/x86_64-win/Bonko Streamer.vst3"
          $setup = "$release/BonkoStreamer-v$env:BONKO_VERSION-Windows-Setup.exe"
          foreach ($artifact in @($plugin, $setup)) {
            & signtool.exe verify /pa /all /tw $artifact
            if ($LASTEXITCODE -ne 0) { throw "Trusted signature verification failed: $artifact" }
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact
            if ($signature.Status -ne "Valid") { throw "Windows signature status is $($signature.Status): $artifact" }
          }

      - name: Exercise Windows installer and uninstaller
        shell: pwsh
        run: |
          $release = "source/audio-plugin-coder/plugins/BonkerStream/release"
          $setup = "$release/BonkoStreamer-v$env:BONKO_VERSION-Windows-Setup.exe"
          $install = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)" }

          $installedPlugin = Join-Path $env:CommonProgramFiles "VST3\Bonko Streamer.vst3\Contents\x86_64-win\Bonko Streamer.vst3"
          $uninstaller = Join-Path $env:ProgramFiles "BONKO Streamer\Uninstall.exe"
          if (-not (Test-Path -LiteralPath $installedPlugin -PathType Leaf)) {
            throw "Installer did not place the VST3 binary in the standard system folder"
          }
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw "Installer did not register its uninstaller"
          }

          if ($env:BONKO_ALLOW_UNSIGNED_QA -ne "true") {
            foreach ($artifact in @($installedPlugin, $uninstaller)) {
              & signtool.exe verify /pa /all /tw $artifact
              if ($LASTEXITCODE -ne 0) { throw "Installed signature verification failed: $artifact" }
              $signature = Get-AuthenticodeSignature -LiteralPath $artifact
              if ($signature.Status -ne "Valid") { throw "Installed signature status is $($signature.Status): $artifact" }
            }
          }

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstaller failed with exit code $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path -LiteralPath (Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $installedPlugin)))) {
            throw "Uninstaller left the BONKO VST3 bundle installed"
          }

      - name: Collect verified release artifacts
        shell: pwsh
        run: |
          $release = "source/audio-plugin-coder/plugins/BonkerStream/release"
          New-Item -ItemType Directory -Force -Path verified-windows-release | Out-Null
          Copy-Item "$release/BonkoStreamer-v$env:BONKO_VERSION-Windows-Setup.exe" verified-windows-release/
          Copy-Item "$release/BonkoStreamer-v$env:BONKO_VERSION-Windows.zip" verified-windows-release/
          Copy-Item pluginval-results verified-windows-release/pluginval-results -Recurse
          Get-FileHash -Algorithm SHA256 verified-windows-release/*.* |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $_.Path)" } |
            Set-Content verified-windows-release/SHA256SUMS.txt -Encoding ascii

      - name: Upload verified Windows release
        uses: actions/upload-artifact@v4
        with:
          name: BonkoStreamer-v${{ inputs.version }}-Windows-${{ inputs.allow_unsigned_qa && 'UNSIGNED-QA' || 'SIGNED-verified' }}
          path: verified-windows-release
          if-no-files-found: error
          retention-days: 7
